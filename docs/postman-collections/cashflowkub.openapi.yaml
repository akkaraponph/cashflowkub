openapi: 3.0.3
info:
  title: CashflowKub API (auth, privacy, and backend operations)
  version: '2026-10-22'
  description: |
    Covers sign-in, account deletion, PDPA endpoints, and the Rust-backed reference data and settings API.
    Next.js remains the public origin and forwards authenticated calls to the private Rust service.

    Naming exception: Better Auth's own endpoints (`/api/auth/*`) use camelCase fields, such as
    `privacyVersion`. Our endpoints (`/api/v1/me/*`) use snake_case.
servers:
  - url: http://localhost:3000
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Better Auth endpoints. Public except delete-user.
  - name: me
    description: The signed-in user's own account data.
paths:
  /internal/health:
    get:
      tags: [operations]
      summary: Check the private Rust backend process
      description: Available only on the backend's private network. Does not expose user or database data.
      servers:
        - url: http://127.0.0.1:8080
      security: []
      responses:
        '200':
          description: Backend process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /api/v1/{resource}:
    parameters:
      - $ref: '#/components/parameters/Resource'
    get:
      tags: [finance]
      summary: List the signed-in user's reference data
      responses:
        '200':
          description: Resource rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [finance]
      summary: Create reference data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInput' }
      responses:
        '201':
          description: Created row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceRow' }
        '400': { description: Invalid resource or field value. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Duplicate name or key. }
  /api/v1/{resource}/{id}:
    parameters:
      - $ref: '#/components/parameters/Resource'
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [finance]
      summary: Get a reference row
      responses:
        '200':
          description: Resource row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Row does not exist for this user. }
    put:
      tags: [finance]
      summary: Update fields on a reference row
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceUpdate' }
      responses:
        '200':
          description: Updated row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceRow' }
        '400': { description: Invalid field value. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Row does not exist for this user. }
        '409': { description: Duplicate name. }
    patch:
      tags: [finance]
      summary: Partially update a reference row
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceUpdate' }
      responses:
        '200':
          description: Updated row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceRow' }
        '400': { description: Invalid field value. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Row does not exist for this user. }
    delete:
      tags: [finance]
      summary: Delete a reference row
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Row does not exist for this user. }
        '409': { description: Row is referenced by existing transactions. }
  /api/v1/settings:
    get:
      tags: [finance]
      summary: Get the signed-in user's settings
      responses:
        '200':
          description: Settings object.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [finance]
      summary: Set monthly income
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { description: monthlyIncome must be a non-negative integer. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/transactions:
    get:
      tags: [finance]
      summary: List transactions
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [income, expense] } }
        - { name: activity, in: query, schema: { type: string, enum: [receive, pay, save, pay_debt, withdraw, transfer] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: account, in: query, schema: { type: string } }
        - { name: from, in: query, description: Inclusive date, schema: { type: string, example: '2026-06-01' } }
        - { name: to, in: query, description: Inclusive date, schema: { type: string, example: '2026-06-30' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000 } }
      responses:
        '200':
          description: Newest first; encrypted name and note fields are returned decrypted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionList' }
        '400': { description: Invalid date filter. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [finance]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '201':
          description: Created transaction view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionView' }
        '400': { description: Invalid transaction, date, amount, activity or reference. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/transactions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [finance]
      summary: Get a transaction
      responses:
        '200':
          description: Transaction view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Transaction does not exist for this user. }
    put:
      tags: [finance]
      summary: Update a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Updated transaction view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionView' }
        '400': { description: Invalid transaction input. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Transaction does not exist for this user. }
    patch:
      tags: [finance]
      summary: Partially update a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Updated transaction view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionView' }
        '400': { description: Invalid transaction input. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Transaction does not exist for this user. }
    delete:
      tags: [finance]
      summary: Delete a transaction
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Transaction does not exist for this user. }
  /api/v1/transactions/batch:
    post:
      tags: [finance]
      summary: Create transactions atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '201':
          description: Created rows; any invalid row rolls back the whole batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionList' }
        '400': { description: Invalid item or batch size. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [finance]
      summary: Delete transactions owned by the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Unknown and other users' IDs are skipped.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer }
        '400': { description: Invalid ID list. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/v1/transactions/page:
    get:
      tags: [finance]
      summary: Read a page of transactions for a server-rendered page
      description: Private service endpoint. The Next.js server supplies the service bearer token and verified user ID.
      servers:
        - url: http://127.0.0.1:8080
      security:
        - backendToken: []
      parameters:
        - { name: x-cfk-user-id, in: header, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: size, in: query, schema: { type: integer, enum: [50, 100, 200, 500] } }
        - { name: from, in: query, schema: { type: string, example: '2026-06-01' } }
        - { name: to, in: query, schema: { type: string, example: '2026-06-30' } }
        - { name: type, in: query, schema: { type: string, enum: [income, expense] } }
      responses:
        '200':
          description: Clamped page and filtered transaction rows.
          content:
            application/json:
              schema:
                type: object
                required: [rows, total, page]
                properties:
                  rows: { type: array, items: { $ref: '#/components/schemas/TransactionView' } }
                  total: { type: integer }
                  page: { type: integer }
        '401': { description: Missing service credentials. }
  /api/auth/sign-up/email:
    post:
      tags: [auth]
      summary: Create an account and sign in
      description: Fails with 400 unless `privacyVersion` is the current privacy notice version. Sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, privacyVersion]
              properties:
                name: { type: string, example: Ploy }
                email: { type: string, format: email, example: ploy@example.com }
                password: { type: string, minLength: 10, example: a-long-password }
                privacyVersion: { type: string, example: '2026-10-19', description: Must equal the current notice version. }
      responses:
        '200':
          description: Account created; `Set-Cookie` carries the session.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400':
          description: Password shorter than 10, invalid email, or wrong `privacyVersion`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '422':
          description: The email is already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '429':
          description: Rate limited.
  /api/auth/sign-in/email:
    post:
      tags: [auth]
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in; `Set-Cookie` carries the session.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401':
          description: Wrong email or password (`INVALID_EMAIL_OR_PASSWORD`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '429':
          description: Rate limited.
  /api/auth/sign-out:
    post:
      tags: [auth]
      summary: Sign out
      description: Ends the current session and clears the cookie.
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
  /api/auth/delete-user:
    post:
      tags: [auth]
      summary: Permanently delete my account and all of my data
      description: |
        Hard delete (PDPA s.33). Cascades to every row the user owns and to all of their sessions, so other
        signed-in devices stop working at once. Cannot be undone. Offer `/api/v1/me/export` first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Deleted; the session cookie is cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '400':
          description: Wrong password (`INVALID_PASSWORD`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
        '401':
          description: Not signed in.
  /api/v1/me/export:
    get:
      tags: [me]
      summary: Download all of my data as JSON
      description: PDPA access and portability (s.30-31). Encrypted fields are decrypted; no password hash or session is included.
      responses:
        '200':
          description: A JSON attachment named `cashflowkub-export-YYYY-MM-DD.json`.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/privacy:
    post:
      tags: [me]
      summary: Acknowledge the current privacy notice
      description: Used by `/privacy-update` after the notice version changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privacy_version]
              properties:
                privacy_version: { type: string, example: '2026-10-19', description: Must equal the current notice version. }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [privacy_version, privacy_accepted_at]
                properties:
                  privacy_version: { type: string }
                  privacy_accepted_at: { type: string, format: date-time }
        '400':
          description: The version is not the current one (code `privacyVersionOutdated`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  parameters:
    Resource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [accounts, categories, budgets, goals, assets, channels, income-categories]
  securitySchemes:
    backendToken:
      type: http
      scheme: bearer
      description: Private Next.js to Rust service token, not a user session token.
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        Session cookie set by sign-in or sign-up. Required on every `/api/v1/*` endpoint. Over HTTPS the
        cookie name carries a `__Secure-` prefix; browsers send it automatically.
  responses:
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not signed in, code: unauthorized }
  schemas:
    TransactionInput:
      type: object
      required: [name, acct, amount]
      properties:
        name: { type: string, minLength: 1 }
        cat: { type: string }
        activity: { type: string, enum: [receive, pay, save, pay_debt, withdraw, transfer] }
        item: { type: string }
        acct: { type: string, minLength: 1 }
        amount: { type: number, minimum: -999999999999.99, maximum: 999999999999.99, multipleOf: 0.01 }
        note: { type: string }
        interest: { type: number, minimum: 0, multipleOf: 0.01 }
        fee: { type: number, minimum: 0, multipleOf: 0.01 }
        goal: { type: string }
        date: { type: string, description: YYYY-MM-DD, Mon D, YYYY, or RFC 3339 timestamp }
    TransactionUpdate:
      type: object
      description: Partial transaction input; all fields are optional on update.
      properties:
        name: { type: string, minLength: 1 }
        cat: { type: string }
        activity: { type: string, enum: [receive, pay, save, pay_debt, withdraw, transfer] }
        item: { type: string }
        acct: { type: string, minLength: 1 }
        amount: { type: number, minimum: -999999999999.99, maximum: 999999999999.99, multipleOf: 0.01 }
        note: { type: string }
        interest: { type: number, minimum: 0, multipleOf: 0.01 }
        fee: { type: number, minimum: 0, multipleOf: 0.01 }
        goal: { type: string }
        date: { type: string, description: YYYY-MM-DD, Mon D, YYYY, or RFC 3339 timestamp }
    TransactionView:
      type: object
      required: [id, name, cat, acct, amount, note, interest, fee, goal, activity, item, isoDate, date, group]
      properties:
        id: { type: integer }
        name: { type: string }
        cat: { type: string }
        acct: { type: string }
        amount: { type: number }
        note: { type: string }
        interest: { type: number }
        fee: { type: number }
        goal: { type: string }
        activity: { type: string, enum: [receive, pay, save, pay_debt, withdraw, transfer] }
        item: { type: string }
        isoDate: { type: string, format: date }
        date: { type: string, example: 'Jun 18, 2026' }
        group: { type: string, example: Today }
    TransactionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TransactionView' }
    ResourceInput:
      oneOf:
        - $ref: '#/components/schemas/AccountInput'
        - $ref: '#/components/schemas/CategoryInput'
        - $ref: '#/components/schemas/BudgetInput'
        - $ref: '#/components/schemas/GoalInput'
        - $ref: '#/components/schemas/AssetInput'
        - $ref: '#/components/schemas/ChannelInput'
        - $ref: '#/components/schemas/IncomeCategoryInput'
      description: Resource-specific fields; existing API field names and casing are preserved.
    ResourceUpdate:
      type: object
      description: Any subset of the selected resource's writable fields.
      additionalProperties: true
      properties:
        name: { type: string, minLength: 1 }
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        cat: { type: string, minLength: 1 }
        sub: { type: string }
        th: { type: string }
        short: { type: string }
        icon: { type: string }
        tint: { type: string }
        type: { type: string, enum: [income, expense] }
        kind: { type: string }
        balance: { type: integer }
        spent: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        saved: { type: integer, minimum: 0 }
        target: { type: integer, minimum: 1 }
        monthly: { type: integer, minimum: 0 }
        value: { type: integer }
        opening: { type: integer }
        startDate: { type: string }
        startTh: { type: string }
        by: { type: string }
        sort: { type: integer }
    AccountInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        sub: { type: string }
        balance: { type: integer }
        icon: { type: string }
        tint: { type: string }
        kind: { type: string, enum: [bank, cash, ewallet, credit] }
        startDate: { type: string }
        startTh: { type: string }
        sort: { type: integer }
      example: { name: Main account, kind: bank, balance: 12000 }
    CategoryInput:
      type: object
      required: [key, label]
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        th: { type: string }
        short: { type: string }
        icon: { type: string }
        tint: { type: string }
        type: { type: string, enum: [income, expense] }
        sub: { type: string }
        sort: { type: integer }
    BudgetInput:
      type: object
      required: [cat, limit]
      properties:
        cat: { type: string, minLength: 1 }
        spent: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        sort: { type: integer }
    GoalInput:
      type: object
      required: [name, target]
      properties:
        name: { type: string, minLength: 1 }
        th: { type: string }
        icon: { type: string }
        saved: { type: integer, minimum: 0 }
        target: { type: integer, minimum: 1 }
        monthly: { type: integer, minimum: 0 }
        by: { type: string }
        sort: { type: integer }
    AssetInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        th: { type: string }
        icon: { type: string }
        tint: { type: string }
        value: { type: integer }
        sort: { type: integer }
    ChannelInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        th: { type: string }
        kind: { type: string, enum: [saving, mf, pf, stock, gold, bond] }
        icon: { type: string }
        tint: { type: string }
        opening: { type: integer }
        startDate: { type: string }
        startTh: { type: string }
        sort: { type: integer }
    IncomeCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        th: { type: string }
        sub: { type: string, enum: [main, side, passive] }
        icon: { type: string }
        tint: { type: string }
        sort: { type: integer }
    ResourceRow:
      type: object
      description: Resource row without userId. Fields vary by resource.
      properties:
        id: { type: integer }
    ResourceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ResourceRow' }
    Settings:
      type: object
      required: [monthlyIncome]
      properties:
        monthlyIncome: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, example: unauthorized }
    AuthError:
      type: object
      properties:
        code: { type: string, example: INVALID_EMAIL_OR_PASSWORD }
        message: { type: string }
    AuthResult:
      type: object
      properties:
        token: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: string }
    UserExport:
      type: object
      required: [format, version, exported_at, privacy, user, data]
      properties:
        format: { type: string, enum: [cashflowkub-export] }
        version: { type: integer, enum: [1] }
        exported_at: { type: string, format: date-time }
        privacy:
          type: object
          properties:
            version: { type: string }
            accepted_at: { type: string, format: date-time }
        user:
          type: object
          properties:
            email: { type: string }
            name: { type: string }
            created_at: { type: string, format: date-time }
        data:
          type: object
          description: One array of rows per owned table (accounts, categories, transactions, budgets, goals, debts, debt_payments, settings, assets, bills, bill_payments, channels, income_categories, plan_items, asset_snapshots, net_worth_histories, monthly_cashflows, day_spends, setup_goals, setup_goal_channels).
          additionalProperties:
            type: array
            items: { type: object, additionalProperties: true }
